name: Canonical App updater bridge

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable commit from openagent-uno/openagent main
        required: true
        type: string
      version:
        description: Exact canonical App package version (for example 1.1.0-beta.16)
        required: true
        type: string

env:
  CARGO_BUILD_JOBS: 2

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: canonical-app-bridge-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: canonical/apps/app

jobs:
  verify-tag:
    name: verify canonical source and installed identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source admission and provenance guards
        run: node --test "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.test.mjs" "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.test.mjs" "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-build.test.mjs"
      - name: Verify exact canonical commit, source versions, identity and host-tools pins
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION"

  test:
    name: lint, types, and unit tests
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      staging_release_id: ${{ steps.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Install universal dependencies
        working-directory: canonical/apps/app/universal
        run: npm ci
      - name: Install desktop dependencies
        working-directory: canonical/apps/app/desktop
        run: npm ci
      - name: Run app test gate
        run: bash test.sh
      # Drafts are visible only to repository writers. Transfer files stay out
      # of Actions artifact/cache storage and never enter the updater feed.
      - name: Create run-owned unpublished transfer draft
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" create "$RUNNER_TEMP/app-source.json"

  desktop:
    needs: [verify-tag, test]
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package_script: build:mac
            arch_flag: --arm64
            platform_key: darwin-arm64
          - os: macos-15-intel
            package_script: build:mac
            arch_flag: --x64
            platform_key: darwin-x64
          - os: windows-2025
            package_script: build:win
            arch_flag: --x64
            platform_key: win32-x64
          - os: windows-11-arm
            package_script: build:win
            arch_flag: --arm64
            platform_key: win32-arm64
          - os: ubuntu-24.04
            package_script: build:linux
            arch_flag: --x64
            platform_key: linux-x64
          - os: ubuntu-24.04-arm
            package_script: build:linux
            arch_flag: --arm64
            platform_key: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb
      - name: Install universal deps
        working-directory: canonical/apps/app/universal
        run: npm ci
      - name: Build web app
        working-directory: canonical/apps/app/universal
        run: npx expo export --platform web
      - name: Install desktop deps
        working-directory: canonical/apps/app/desktop
        run: npm ci
      # Consume one immutable, version-pinned host-tools artifact. The
      # packaging entrypoint independently verifies its complete manifest.
      - name: Acquire pinned host-tools release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/fetch-host-tools-release.js ${{ matrix.platform_key }} .release-deps/host-tools-dist
      - name: Copy web build and fix paths
        run: |
          rm -rf desktop/web-build
          cp -r universal/dist desktop/web-build
          sed -i.bak 's|href="/|href="./|g; s|src="/|src="./|g' desktop/web-build/index.html
          rm -f desktop/web-build/index.html.bak
        shell: bash
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required}" ]; then
              echo "Required macOS release secret is missing: ${required}"
              exit 1
            fi
          done
      - name: Build Electron app
        working-directory: canonical/apps/app/desktop
        run: ${{ runner.os == 'macOS' && 'node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-build.mjs" npm' || 'npm' }} run ${{ matrix.package_script }} -- ${{ matrix.arch_flag }} --publish never --config.publish.channel "${{ needs.verify-tag.outputs.channel }}"
        env:
          OPENAGENT_REQUIRE_HOST_TOOLS: '1'
          OPENAGENT_HOST_TOOLS_PLATFORM_KEY: ${{ matrix.platform_key }}
          OPENAGENT_HOST_TOOLS_DIST: ${{ github.workspace }}/canonical/apps/app/.release-deps/host-tools-dist
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Smoke-test packaged artifacts and update metadata
        working-directory: canonical/apps/app/desktop
        run: node scripts/test-packaged-artifacts.mjs "${{ matrix.platform_key }}"
        env:
          REQUIRE_SIGNED: ${{ runner.os == 'macOS' && 'true' || 'false' }}
      - name: Stamp canonical payload and legacy executor provenance
        shell: bash
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/stamp-canonical-app-artifacts.mjs" "$RUNNER_TEMP/app-source.json" desktop/release
      - name: Stage verified native files without Actions artifact storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.test.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" upload "$RUNNER_TEMP/app-source.json" "${{ matrix.platform_key }}" desktop/release

  macos-intel-smoke:
    name: launch packaged macOS Intel installers
    needs: [test, desktop]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Install verifier dependencies
        working-directory: canonical/apps/app/desktop
        run: npm ci
      - name: Fetch and verify staged Intel files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.test.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" download "$RUNNER_TEMP/app-source.json" darwin-x64 artifacts
      - name: Verify and launch x64 ZIP and DMG payloads
        run: node desktop/scripts/smoke-macos-installers.mjs artifacts x64

  release:
    needs: [verify-tag, test, desktop, macos-intel-smoke]
    if: always() && needs.desktop.result == 'success' && needs.macos-intel-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Install release verifier dependencies
        working-directory: canonical/apps/app/desktop
        run: npm ci
      - name: Fetch and verify all six staged platform sets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.test.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" download-all "$RUNNER_TEMP/app-source.json" all artifacts
      - name: Merge per-architecture updater metadata without overwrites
        run: node desktop/scripts/merge-update-metadata.js artifacts artifacts/release-metadata
      - name: Verify exact merged release asset set
        run: node desktop/scripts/verify-release-set.mjs artifacts
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.verify-tag.outputs.tag }}"
          existing_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fqx -- "$release_tag" <<<"$existing_tags"; then
            echo "Release ${release_tag} already exists; publish a new beta tag instead."
            exit 1
          fi
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            canonical/apps/app/artifacts/**/*.dmg
            canonical/apps/app/artifacts/**/*.zip
            canonical/apps/app/artifacts/**/*.exe
            canonical/apps/app/artifacts/**/*.AppImage
            canonical/apps/app/artifacts/**/*.deb
            canonical/apps/app/artifacts/release-metadata/*.yml
            canonical/apps/app/artifacts/**/*.blockmap
            canonical/apps/app/artifacts/**/*.sha256
            canonical/apps/app/artifacts/**/release-manifest-*.json
      - name: Upload an unpublished draft release
        id: draft
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenAgent App ${{ needs.verify-tag.outputs.tag }}
          body: |
            Canonical App payload: openagent-uno/openagent@${{ inputs.source_sha }} (apps/app).
            Historical updater executor: openagent-uno/openagent-app@${{ github.sha }}.
            Existing application identity, host-tools pins and updater feed are preserved.
            Draft only: publish after reviewing the exact six-platform asset set.
          files: |
            canonical/apps/app/artifacts/**/*.dmg
            canonical/apps/app/artifacts/**/*.zip
            canonical/apps/app/artifacts/**/*.exe
            canonical/apps/app/artifacts/**/*.AppImage
            canonical/apps/app/artifacts/**/*.deb
            canonical/apps/app/artifacts/release-metadata/*.yml
            canonical/apps/app/artifacts/**/*.blockmap
            canonical/apps/app/artifacts/**/*.sha256
            canonical/apps/app/artifacts/**/release-manifest-*.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          prerelease: ${{ needs.verify-tag.outputs.channel == 'beta' }}
          make_latest: false
      - name: Verify draft asset inventory and retain publication for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          SOURCE_CHANNEL: ${{ needs.verify-tag.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          is_beta=false
          if [[ "$SOURCE_CHANNEL" == beta ]]; then is_beta=true; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-draft.json
          node desktop/scripts/verify-release-set.mjs artifacts \
            --release-json release-draft.json --expect-draft true --expect-prerelease "$is_beta"
          echo "Verified six-platform draft release $RELEASE_ID; publication requires exact asset review." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only this run's transfer draft after final verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.test.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" cleanup "$RUNNER_TEMP/app-source.json"
