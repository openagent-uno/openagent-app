# SOURCE-ONLY public executor candidate. Tiny neutral fixtures, no private payload.
name: Check private-source bootstrap seed contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/private-source-bootstrap/**
      - .github/workflows/private-source-seed-contracts.yml
permissions:
  contents: read
jobs:
  contracts:
    if: ${{ github.repository == 'openagent-uno/openagent-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Parse only the seed and its neutral fixture tests
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('scripts/private-source-bootstrap')
          for name in ('generic-private-source-seed.py', 'genericseed-tests.py'):
              ast.parse((root / name).read_text(encoding='utf-8'), filename=name)
          print('BOOTSTRAP_SEED_SYNTAX_ACCEPTED_NOT_SOURCE_OR_SIGNING_QUALIFICATION')
          PY
      - name: Exercise isolated contracts without credentials, network or application code
        run: env -u GH_TOKEN -u GITHUB_TOKEN python scripts/private-source-bootstrap/genericseed-tests.py -v
# No SDK, runtime, private source artifact, keychain, API write or asset upload.
