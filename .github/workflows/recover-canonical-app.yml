name: Recover reviewed canonical App macOS failure

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Ubuntu fixtures and read-only original log access; no build or drafts
        type: boolean
        default: true
      source_sha:
        description: Original complete canonical App payload SHA (unchanged)
        type: string
        required: true
      version:
        description: Original exact App version (unchanged)
        type: string
        required: true
      original_run_id:
        description: Reviewed failed original Canonical App updater bridge run
        type: string
        required: true
      original_run_attempt:
        description: Original completed attempt owning the unpublished transfer draft
        type: string
        required: true
      original_executor_sha:
        description: Original complete updater executor SHA
        type: string
        required: true
      original_staging_release_id:
        description: Exact original unpublished transfer draft release ID
        type: string
        required: true
      failed_platforms:
        description: JSON array of exactly failed macOS targets; never successful targets
        type: string
        required: true
        default: '["darwin-arm64"]'

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ inputs.validation_only && 'canonical-app-recovery-validation' || 'canonical-app-bridge' }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
  ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
  ORIGINAL_EXECUTOR_SHA: ${{ inputs.original_executor_sha }}
  ORIGINAL_STAGING_RELEASE_ID: ${{ inputs.original_staging_release_id }}
  RECOVER_PLATFORMS: ${{ inputs.failed_platforms }}
  CANONICAL_ROOT: ${{ github.workspace }}/canonical

defaults:
  run:
    working-directory: canonical/apps/app

jobs:
  guards:
    name: test recovery guards
    if: ${{ github.repository == 'openagent-uno/openagent-app' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test exact source, transfer, retry and mixed-provenance recovery guards offline
        working-directory: executor
        run: node --test .github/scripts/canonical-app-source.test.mjs .github/scripts/staged-app-assets.test.mjs .github/scripts/canonical-app-build.test.mjs .github/scripts/canonical-app-recovery.test.mjs
      - name: Verify existing job-token access to the original bounded failure log
        working-directory: executor
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/canonical-app-recovery.mjs verify-log-access

  admit:
    name: admit original failed run and stage
    needs: guards
    if: ${{ !inputs.validation_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      staging_release_id: ${{ steps.staging.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the unchanged canonical payload, identities and pins
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Admit only terminal failed Macs and preserve every successful original native platform
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-recovery.mjs" admit "$RUNNER_TEMP/app-source.json" "$RUNNER_TEMP/recovery-plan.json"
      - name: Create only the new recovery run's unpublished transfer draft
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" create "$RUNNER_TEMP/app-source.json"

  recover-native:
    name: recover native (${{ matrix.platform_key }})
    needs: admit
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.admit.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RECOVERY_PLAN_SHA256: ${{ needs.admit.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Recheck immutable original failure and staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-recovery.mjs" admit "$RUNNER_TEMP/app-source.json" "$RUNNER_TEMP/recovery-plan.json"
      - name: Install universal deps
        working-directory: canonical/apps/app/universal
        run: npm ci
      - name: Build web app
        working-directory: canonical/apps/app/universal
        run: npx expo export --platform web
      - name: Install desktop deps
        working-directory: canonical/apps/app/desktop
        run: npm ci
      # Consume one immutable, version-pinned host-tools artifact. The
      # packaging entrypoint independently verifies its complete manifest.
      - name: Acquire pinned host-tools release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/fetch-host-tools-release.js ${{ matrix.platform_key }} .release-deps/host-tools-dist
      - name: Copy web build and fix paths
        run: |
          rm -rf desktop/web-build
          cp -r universal/dist desktop/web-build
          sed -i.bak 's|href="/|href="./|g; s|src="/|src="./|g' desktop/web-build/index.html
          rm -f desktop/web-build/index.html.bak
        shell: bash
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required}" ]; then
              echo "Required macOS release secret is missing: ${required}"
              exit 1
            fi
          done
      - name: Build Electron app
        working-directory: canonical/apps/app/desktop
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-build.mjs" npm run build:mac -- ${{ matrix.arch_flag }} --publish never --config.publish.channel "${{ needs.admit.outputs.channel }}"
        env:
          OPENAGENT_REQUIRE_HOST_TOOLS: '1'
          OPENAGENT_HOST_TOOLS_PLATFORM_KEY: ${{ matrix.platform_key }}
          OPENAGENT_HOST_TOOLS_DIST: ${{ github.workspace }}/canonical/apps/app/.release-deps/host-tools-dist
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Smoke-test packaged artifacts and update metadata
        working-directory: canonical/apps/app/desktop
        run: node scripts/test-packaged-artifacts.mjs "${{ matrix.platform_key }}"
        env:
          REQUIRE_SIGNED: ${{ runner.os == 'macOS' && 'true' || 'false' }}
      - name: Stamp canonical payload and legacy executor provenance
        shell: bash
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/stamp-canonical-app-artifacts.mjs" "$RUNNER_TEMP/app-source.json" desktop/release
      - name: Stage verified native files without Actions artifact storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.admit.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/staged-app-assets.mjs" upload "$RUNNER_TEMP/app-source.json" "${{ matrix.platform_key }}" desktop/release


  macos-intel-smoke:
    name: launch recovered macOS Intel installers
    needs: [admit, recover-native]
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      RECOVERY_PLAN_SHA256: ${{ needs.admit.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Install verifier dependencies
        working-directory: canonical/apps/app/desktop
        run: npm ci
      - name: Fetch and verify staged Intel files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.admit.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-recovery.mjs" download "$RUNNER_TEMP/app-source.json" "$RUNNER_TEMP/recovery-plan.json" darwin-x64 artifacts
      - name: Verify and launch x64 ZIP and DMG payloads
        run: node desktop/scripts/smoke-macos-installers.mjs artifacts x64


  release:
    needs: [guards, admit, recover-native, macos-intel-smoke]
    if: always() && needs.recover-native.result == 'success' && needs.macos-intel-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECOVERY_PLAN_SHA256: ${{ needs.admit.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openagent-uno/openagent
          ref: ${{ inputs.source_sha }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify this runner's canonical source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/canonical" fetch origin main:refs/remotes/origin/main --no-tags
          node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-source.mjs" \
            "$GITHUB_WORKSPACE/canonical" "$SOURCE_SHA" "$SOURCE_VERSION" "$RUNNER_TEMP/app-source.json"
      - name: Install release verifier dependencies
        working-directory: canonical/apps/app/desktop
        run: npm ci
      - name: Fetch and verify all six staged platform sets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_ID: ${{ needs.admit.outputs.staging_release_id }}
        run: node "$GITHUB_WORKSPACE/executor/.github/scripts/canonical-app-recovery.mjs" download-all "$RUNNER_TEMP/app-source.json" "$RUNNER_TEMP/recovery-plan.json" all artifacts
      - name: Merge per-architecture updater metadata without overwrites
        run: node desktop/scripts/merge-update-metadata.js artifacts artifacts/release-metadata
      - name: Verify exact merged release asset set
        run: node desktop/scripts/verify-release-set.mjs artifacts
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.admit.outputs.tag }}"
          existing_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fqx -- "$release_tag" <<<"$existing_tags"; then
            echo "Release ${release_tag} already exists; publish a new beta tag instead."
            exit 1
          fi
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            canonical/apps/app/artifacts/**/*.dmg
            canonical/apps/app/artifacts/**/*.zip
            canonical/apps/app/artifacts/**/*.exe
            canonical/apps/app/artifacts/**/*.AppImage
            canonical/apps/app/artifacts/**/*.deb
            canonical/apps/app/artifacts/release-metadata/*.yml
            canonical/apps/app/artifacts/**/*.blockmap
            canonical/apps/app/artifacts/**/*.sha256
            canonical/apps/app/artifacts/**/release-manifest-*.json
            ${{ runner.temp }}/recovery-receipt.json
      - name: Upload an unpublished draft release
        id: draft
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          tag_name: ${{ needs.admit.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenAgent App ${{ needs.admit.outputs.tag }}
          body_path: ${{ runner.temp }}/recovery-body.md
          files: |
            canonical/apps/app/artifacts/**/*.dmg
            canonical/apps/app/artifacts/**/*.zip
            canonical/apps/app/artifacts/**/*.exe
            canonical/apps/app/artifacts/**/*.AppImage
            canonical/apps/app/artifacts/**/*.deb
            canonical/apps/app/artifacts/release-metadata/*.yml
            canonical/apps/app/artifacts/**/*.blockmap
            canonical/apps/app/artifacts/**/*.sha256
            canonical/apps/app/artifacts/**/release-manifest-*.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          prerelease: ${{ needs.admit.outputs.channel == 'beta' }}
          make_latest: false
      - name: Verify draft asset inventory and retain publication for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          SOURCE_CHANNEL: ${{ needs.admit.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          is_beta=false
          if [[ "$SOURCE_CHANNEL" == beta ]]; then is_beta=true; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-draft.json
          node desktop/scripts/verify-release-set.mjs artifacts \
            --release-json release-draft.json --expect-draft true --expect-prerelease "$is_beta"
          echo "Verified six-platform draft release $RELEASE_ID; publication requires exact asset review." >> "$GITHUB_STEP_SUMMARY"
      # Preserve both stages for exact provenance review; no automatic deletion.
